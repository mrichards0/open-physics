<p id="fs-id1168055311511">Suppose that a person takes 0.5 s to react and move his hand to catch an object he has dropped. (a) How far does the object fall on Earth, where <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mi>g</mi><mo>=</mo><mn>9.8</mn><mspace width="0.2em"></mspace><msup><mrow><mtext>m/s</mtext></mrow><mn>2</mn></msup><mo>?</mo></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mi>g</mi><mo>=</mo><mn>9.8</mn><mspace width="0.2em"></mspace><msup><mrow><mtext>m/s</mtext></mrow><mn>2</mn></msup><mo>?</mo></mrow></annotation-xml></semantics></math></span> (b) How far does the object fall on the Moon, where the acceleration due to gravity is 1/6 of that on Earth?</p>
