<p id="fs-id1168057354249"><strong>Unreasonable results</strong> A runner approaches the finish line and is 75 m away; her speed at this position is 8 m/s. She accelerates opposite to the motion at this point at 0.5 m/s<sup>2</sup>. How long does it take her to cross the finish line from 75 m away? Is this reasonable?</p></div>
