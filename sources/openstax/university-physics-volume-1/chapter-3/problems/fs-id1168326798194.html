<p id="fs-id1168326822697">A cyclist rides 8.0 km east for 20 minutes, then they turn and head west for 8 minutes and 3.2 km. Finally, they ride east for 16 km, which takes 40 minutes. (a) What is the final displacement of the cyclist? (b) What is their average velocity?</p>
