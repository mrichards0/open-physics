<p id="fs-id1168329187424">A swan on a lake gets airborne by flapping its wings and running on top of the water. (a) If the swan must reach a velocity of 6.00 m/s to take off and it accelerates from rest at an average rate of <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mn>0.35</mn><mspace width="0.2em"></mspace><msup><mrow><mtext>m/s</mtext></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mn>0.35</mn><mspace width="0.2em"></mspace><msup><mrow><mtext>m/s</mtext></mrow><mrow><mn>2</mn></mrow></msup></mrow></annotation-xml></semantics></math></span>, how far will it travel before becoming airborne? (b) How long does this take?</p>
