<p id="fs-id1168329484452"><strong>Unreasonable results</strong> At the end of a race, a runner accelerates opposite to the motion from a velocity of 9.00 m/s at a rate of 2.00 m/s<sup>2</sup>. (a) How far does she travel in the next 5.00 s? (b) What is her final velocity? (c) Evaluate the result. Does it make sense?</p>
