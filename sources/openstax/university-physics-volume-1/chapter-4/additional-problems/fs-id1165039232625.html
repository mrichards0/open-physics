<p id="fs-id1165039232630">A propeller blade at rest starts to rotate from <em data-effect="italics">t</em> = 0 s to <em data-effect="italics">t</em> = 5.0 s with a tangential acceleration of the tip of the blade at <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mn>3.00</mn><mspace width="0.2em"></mspace><mrow><mtext>m</mtext><mtext>/</mtext><mrow><msup><mtext>s</mtext><mn>2</mn></msup></mrow></mrow><mo>.</mo></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mn>3.00</mn><mspace width="0.2em"></mspace><mrow><mtext>m</mtext><mtext>/</mtext><mrow><msup><mtext>s</mtext><mn>2</mn></msup></mrow></mrow><mo>.</mo></mrow></annotation-xml></semantics></math></span> The tip of the blade is 1.5 m from the axis of rotation. At <em data-effect="italics">t</em> = 5.0 s, what is the total acceleration of the tip of the blade?</p>
