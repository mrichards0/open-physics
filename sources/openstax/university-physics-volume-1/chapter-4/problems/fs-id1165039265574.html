<p id="fs-id1165039265578">A seagull can fly at a velocity of 9.00 m/s in still air. (a) If it takes the bird 20.0 min to travel 6.00 km straight into an oncoming wind, what is the velocity of the wind? (b) If the bird turns around and flies with the wind, how long will it take the bird to return 6.00 km?</p>
