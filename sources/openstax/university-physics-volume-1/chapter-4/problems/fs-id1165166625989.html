<p id="fs-id1165166625994">At a particular instant, a hot air balloon is 100 m in the air and descending at a constant speed of 2.0 m/s. At this exact instant, a girl throws a ball horizontally, relative to herself, with an initial speed of 20 m/s. When she lands, where will she find the ball? Ignore air resistance.</p>
