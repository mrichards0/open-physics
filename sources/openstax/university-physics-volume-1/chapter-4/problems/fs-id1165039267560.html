<p id="fs-id1165039267564">A small plane flies at 200 km/h in still air. If the wind blows directly out of the west at 50 km/h, (a) in what direction must the pilot head her plane to move directly north across land and (b) how long does it take her to reach a point 300 km directly north of her starting point?</p>
