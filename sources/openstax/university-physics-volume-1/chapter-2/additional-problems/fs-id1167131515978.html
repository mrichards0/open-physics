<p id="fs-id1167131626949">If the velocity vector of a polar bear is <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>u</mi><mo stretchy="false">â</mo></mover></mstyle><mo>=</mo><mo stretchy="false">(</mo><mn>â18.0</mn><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>i</mi><mo>^</mo></mover></mstyle><mo>â</mo><mn>13.0</mn><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>j</mi><mo>^</mo></mover></mstyle><mo stretchy="false">)</mo><mrow><mrow><mtext>km</mtext></mrow><mtext>/</mtext><mtext>h</mtext></mrow></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>u</mi><mo stretchy="false">â</mo></mover></mstyle><mo>=</mo><mo stretchy="false">(</mo><mn>â18.0</mn><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>i</mi><mo>^</mo></mover></mstyle><mo>â</mo><mn>13.0</mn><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>j</mi><mo>^</mo></mover></mstyle><mo stretchy="false">)</mo><mrow><mrow><mtext>km</mtext></mrow><mtext>/</mtext><mtext>h</mtext></mrow></mrow></annotation-xml></semantics></math></span>, how fast and in what geographic direction is it heading? Here, <span class="os-math-in-para"><math display="inline"><semantics><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>i</mi><mo>^</mo></mover></mstyle></mrow><annotation-xml encoding="MathML-Content"><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>i</mi><mo>^</mo></mover></mstyle></annotation-xml></semantics></math></span> and <span class="os-math-in-para"><math display="inline"><semantics><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>j</mi><mo>^</mo></mover></mstyle></mrow><annotation-xml encoding="MathML-Content"><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>j</mi><mo>^</mo></mover></mstyle></annotation-xml></semantics></math></span> are directions to geographic east and north, respectively.</p>
