<p id="fs-id1167131518917">The following figure shows a triangle formed by the three vectors <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>A</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>A</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></annotation-xml></semantics></math></span>, <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>B</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>B</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></annotation-xml></semantics></math></span>, and <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></annotation-xml></semantics></math></span>. If vector <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><msup><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle><mo>â²</mo></msup></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><msup><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle><mo>â²</mo></msup></mrow></annotation-xml></semantics></math></span> is drawn between the midpoints of vectors <span class="os-math-in-para"><math display="inline"><semantics><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>A</mi><mo stretchy="false">â</mo></mover></mstyle></mrow><annotation-xml encoding="MathML-Content"><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>A</mi><mo stretchy="false">â</mo></mover></mstyle></annotation-xml></semantics></math></span> and <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>B</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>B</mi><mo stretchy="false">â</mo></mover></mstyle></mrow></annotation-xml></semantics></math></span>, show that <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><msup><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle><mo>â²</mo></msup><mo>=</mo><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle><mtext>/</mtext><mn>2</mn></mrow></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><msup><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle><mo>â²</mo></msup><mo>=</mo><mrow><mstyle mathsize="normal" mathvariant="bold"><mover accent="true"><mi>C</mi><mo stretchy="false">â</mo></mover></mstyle><mtext>/</mtext><mn>2</mn></mrow></mrow></annotation-xml></semantics></math></span>.</p>
