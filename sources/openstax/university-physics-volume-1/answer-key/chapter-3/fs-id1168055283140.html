<p id="fs-id1168055310472">At this acceleration she comes to a full stop in <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mi>t</mi><mo>=</mo><mfrac><mrow><mo>â</mo><msub><mi>v</mi><mn>0</mn></msub></mrow><mi>a</mi></mfrac><mo>=</mo><mfrac><mn>8</mn><mrow><mn>0.5</mn></mrow></mfrac><mo>=</mo><mn>16</mn><mspace width="0.2em"></mspace><mtext>s</mtext></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mi>t</mi><mo>=</mo><mfrac><mrow><mo>â</mo><msub><mi>v</mi><mn>0</mn></msub></mrow><mi>a</mi></mfrac><mo>=</mo><mfrac><mn>8</mn><mrow><mn>0.5</mn></mrow></mfrac><mo>=</mo><mn>16</mn><mspace width="0.2em"></mspace><mtext>s</mtext></mrow></annotation-xml></semantics></math></span>, but the distance covered is <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mi>x</mi><mo>=</mo><mn>8</mn><mspace width="0.2em"></mspace><mtext>m/s(16</mtext><mspace width="0.2em"></mspace><mtext>s)</mtext><mo>â</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="false">(</mo><mn>0.5</mn><mo stretchy="false">)</mo><msup><mrow><mo stretchy="false">(</mo><mn>16</mn><mspace width="0.2em"></mspace><mtext>s</mtext><mo stretchy="false">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>64</mn><mspace width="0.2em"></mspace><mtext>m</mtext></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mi>x</mi><mo>=</mo><mn>8</mn><mspace width="0.2em"></mspace><mtext>m/s(16</mtext><mspace width="0.2em"></mspace><mtext>s)</mtext><mo>â</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="false">(</mo><mn>0.5</mn><mo stretchy="false">)</mo><msup><mrow><mo stretchy="false">(</mo><mn>16</mn><mspace width="0.2em"></mspace><mtext>s</mtext><mo stretchy="false">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>64</mn><mspace width="0.2em"></mspace><mtext>m</mtext></mrow></annotation-xml></semantics></math></span>, which is less than the distance she is away from the finish line, so she never finishes the race.</p>
