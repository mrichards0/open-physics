row></mfrac><msup><mrow><mtext>km/s</mtext></mrow><mn>2</mn></msup></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mi>a</mi><mo>=</mo><mo>â</mo><mfrac><mrow><mn>0.1</mn></mrow><mrow><mn>2400.0</mn></mrow></mfrac><msup><mrow><mtext>km/s</mtext></mrow><mn>2</mn></msup></mrow></annotation-xml></semantics></math></span> and <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mn>0.014167</mn><mspace width="0.2em"></mspace><mtext>km/s</mtext></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mn>0.014167</mn><mspace width="0.2em"></mspace><mtext>km/s</mtext></mrow></annotation-xml></semantics></math></span>, which is <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mn>51.0</mn><mspace width="0.2em"></mspace><mtext>km/h</mtext></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mn>51.0</mn><mspace width="0.2em"></mspace><mtext>km/h</mtext></mrow></annotation-xml></semantics></math></span>. Velocity at the end of the trip is <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mi>v</mi><mo>=</mo><mn>21.0</mn><mspace width="0.2em"></mspace><mtext>km/h</mtext></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mi>v</mi><mo>=</mo><mn>21.0</mn><mspace width="0.2em"></mspace><mtext>km/h</mtext></mrow></annotation-xml></semantics></math></span>.</p>
