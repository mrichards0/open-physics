<p id="fs-id1168327948336"> Suppose we want the formula for the volume of a sphere. The two expressions commonly mentioned in elementary discussions of spheres are <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mn>4</mn><mi>Ï</mi><msup><mi>r</mi><mn>2</mn></msup></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mn>4</mn><mi>Ï</mi><msup><mi>r</mi><mn>2</mn></msup></mrow></annotation-xml></semantics></math></span> and <span class="os-math-in-para"><math display="inline"><semantics><mrow><mrow><mn>4</mn><mi>Ï</mi><msup><mi>r</mi><mn>3</mn></msup><mtext>/</mtext><mn>3</mn><mo>.</mo></mrow></mrow><annotation-xml encoding="MathML-Content"><mrow><mn>4</mn><mi>Ï</mi><msup><mi>r</mi><mn>3</mn></msup><mtext>/</mtext><mn>3</mn><mo>.</mo></mrow></annotation-xml></semantics></math></span> One is the volume of a sphere of radius <em data-effect="italics">r</em> and the other is its surface area. Which one is the volume?</p>
