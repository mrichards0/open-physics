<div class="os-problem-container">
<p id="fs-id1168329070959">Consider the equation <em data-effect="italics">y = mt +b</em>, where the dimension of <em data-effect="italics">y</em> is length and the dimension of <em data-effect="italics">t</em> is time, and <em data-effect="italics">m</em> and <em data-effect="italics">b</em> are constants. What are the dimensions and SI units of (a) <em data-effect="italics">m</em> and (b) <em data-effect="italics">b</em>?</p>
